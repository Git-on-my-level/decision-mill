<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171d" media="(prefers-color-scheme: dark)">
<title>Decision Mill</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="home">
<div id="app">
  <aside id="sidebar">
    <header id="brand">
      <a href="#/" class="brand-link"><h1>DECISION&nbsp;MILL</h1></a>
      <div class="sub" id="project-name" hidden></div>
      <button id="drawer-close" type="button" aria-label="Close menu">×</button>
    </header>
    <div id="global-search">
      <button id="search-trigger" type="button" aria-label="Global search"><span>search everything…</span><kbd>⌘K</kbd></button>
    </div>
    <div id="ws-switch" hidden></div>
    <nav id="nav" aria-label="Spec sets and label tasks"></nav>
    <div id="bucket-totals" aria-label="Totals across all specs" hidden></div>
    <footer id="side-foot">
      <span id="whoami" title="labels and notes are attributed to this reviewer"></span>
      <button id="help-trigger" type="button" title="Keyboard shortcuts (?)">?</button>
      <button id="theme-toggle" type="button">◐</button>
    </footer>
  </aside>

  <header id="topbar">
    <button id="menu-toggle" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
    <button id="topbar-title" type="button" aria-label="Pick a spec or task"><span class="tt-name">Decision Mill</span><span class="tt-sub"></span></button>
    <button id="topbar-search" type="button" aria-label="Search everything">⌕</button>
  </header>
  <div id="drawer-backdrop" hidden></div>

  <main id="main">
    <section id="home-view"></section>
    <section id="spec-view" hidden>
      <details id="spec-instr" class="instructions" hidden></details>
      <div id="spec-header"></div>
      <div id="toolbar">
        <div id="filters" aria-label="Filters"></div>
        <div id="progress"></div>
      </div>
      <div id="items"></div>
      <div id="mbar" role="region" aria-label="Decide the current item" hidden>
        <div class="mbar-nav">
          <button id="mbar-prev" type="button" aria-label="Previous item">‹</button>
          <button id="mbar-label" type="button" title="Show this item"><span class="mb-id"></span><small class="mb-pos"></small></button>
          <button id="mbar-next" type="button" aria-label="Next item">›</button>
        </div>
        <div id="mbar-slot"></div>
      </div>
    </section>
    <section id="label-view" hidden></section>
  </main>

  <aside id="code-panel" hidden>
    <header>
      <span id="code-title" class="mono"></span>
      <button id="code-close" title="Close (Esc)">×</button>
    </header>
    <pre id="code-body" class="mono"></pre>
  </aside>
</div>
<div id="search-modal" hidden>
  <div class="sm-backdrop"></div>
  <div class="sm-panel" role="dialog" aria-label="Global search">
    <input id="search-input" type="search" placeholder="search specs and label items — ids, titles, prose, transcripts, notes…" spellcheck="false" autocomplete="off">
    <div id="search-results"></div>
    <div class="sm-hint">↵ open top result · esc close</div>
  </div>
</div>
<div id="help-modal" hidden>
  <div class="sm-backdrop"></div>
  <div class="sm-panel help-panel" role="dialog" aria-label="Keyboard shortcuts"><div id="help-body"></div><div class="sm-hint">? or esc to close</div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="vendor/marked.js"></script>
<script src="common.js"></script>
<script src="view-logic.js"></script>
<script src="options-logic.js"></script>
<script src="comment-logic.js"></script>
<script src="spec.js"></script>
<script src="speakers.js"></script>
<script src="proposal-diff.js"></script>
<script src="pair-logic.js"></script>
<script src="label.js"></script>
<script src="shell.js"></script>
</body>
</html>
