# Fictional demo of blind variant comparison with line comments — every name,
# meeting and number here is invented. Each card shows three versions of the same
# meeting notes under letters A/B/C. Letters were assigned with
# `node tools/spec-review/letters.js` (a seeded Latin square), so every variant is
# A, B and C exactly once.
id: variants-demo
title: Which notes are best? — fictional meetings (blind)
question: Which notes would you rather keep?
instructions: |
  Each card shows 3 versions of the notes for one meeting, labelled A, B, C, with the
  transcript underneath. Pick the version you would rather keep.

  **Comment on what made the call.** Select the words in a version and press `c`
  (or tap **Comment**): "wrong amount", "invented Ines", "no owner". A tag
  (wrong name, missing, hallucinated, too long, formatting) takes one click.
  Which version is which stays hidden until you label the card.
labels:
  - {id: A, label: A, key: "1"}
  - {id: B, label: B, key: "2"}
  - {id: C, label: C, key: "3"}
  - {id: tie, label: Tie, key: "4", tone: neutral}
  - {id: none, label: None good, key: "5", tone: negative}
  - {id: unsure, label: Unsure, key: "6"}
blind: true
round_size: 3
meta_display: [words]
models:
  - {id: terse, verdict_path: hidden.terse_letter}
  - {id: warm, verdict_path: hidden.warm_letter}
  - {id: thorough, verdict_path: hidden.thorough_letter}
workspace: demo
decision: Which notes style should ship as the default?
enough_when: {labels: 3, comments: 3}
minutes_per_round: 4
